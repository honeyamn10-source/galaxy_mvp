version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: galaxy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: galaxy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for real-time events
  redis:
    image: redis:7-alpine
    container_name: galaxy-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: galaxy-auth-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-galaxy}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      DEFAULT_EDGE_API_KEY: ${DEFAULT_EDGE_API_KEY:?set DEFAULT_EDGE_API_KEY in .env}
      DEFAULT_EDGE_ORG_NAME: ${DEFAULT_EDGE_ORG_NAME:-Edge Demo}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
    ports:
      - "8700:8700"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro,z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Authority chain node (galaxyd)
  authority-chain:
    build: ./authority-chain
    container_name: galaxy-authority-chain
    ports:
      - "1317:1317"
      - "9090:9090"
      - "26657:26657"
    environment:
      CHAIN_ID: galaxy-1
      CHAIN_DATA_DIR: /data
      CHAIN_VOTE_THRESHOLD: 2
      CHAIN_GRPC_ADDR: 0.0.0.0:9090
      CHAIN_REST_ADDR: 0.0.0.0:1317
      CHAIN_RPC_ADDR: 0.0.0.0:26657
      CHAIN_REWARD_UGALAXY: 100
      CHAIN_SUBMISSION_FEE_UGALAXY: 5
      CHAIN_ALLOW_FEE_OVERDRAFT: "true"
      CHAIN_VOTE_WINDOW_SECONDS: 3600
      CHAIN_COSMWASM_ENABLED: "true"
      CHAIN_COMPLIANCE_URL: http://compliance-engine:8400
      CHAIN_COMPLIANCE_TIMEOUT: 4s
      LLM_SERVICE_URL: http://llm-service:8600
      LLM_TIMEOUT: "30"
      AUTH_SERVICE_URL: http://auth-service:8700
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    volumes:
      - authority_data:/data
      - ./shared:/app/shared:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compliance-engine:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1317/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  swarm-node-1:
    build: ./swarm-node
    container_name: galaxy-swarm-node-1
    environment:
      SWARM_NODE_NAME: swarm-node-1
      SWARM_IDENTITY_SEED: swarm-node-1
      SWARM_P2P_PORT: 7001
      SWARM_INGRESS_ADDR: ":8443"
      SWARM_HEALTH_ADDR: ":8081"
      SWARM_RENDEZVOUS: galaxy-v2
      SWARM_BOOTSTRAP_SEEDS: ""
      SWARM_FORWARD_MODE: http
      VALIDATOR_HTTP_URL: http://authority-chain:1317/galaxy/v1/events
      SWARM_CREATOR_ADDRESS: galaxy1swarmsubmitter
      SWARM_TLS_CERT: /certs/swarm-node.crt
      SWARM_TLS_KEY: /certs/swarm-node.key
      SWARM_CLIENT_CA: /certs/ca.crt
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    ports:
      - "7001:7001"
      - "8443:8443"
      - "8081:8081"
    depends_on:
      authority-chain:
        condition: service_started
    volumes:
      - ./infra/certs/dev:/certs:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  swarm-node-2:
    build: ./swarm-node
    container_name: galaxy-swarm-node-2
    environment:
      SWARM_NODE_NAME: swarm-node-2
      SWARM_IDENTITY_SEED: swarm-node-2
      SWARM_P2P_PORT: 7001
      SWARM_INGRESS_ADDR: ":8443"
      SWARM_HEALTH_ADDR: ":8081"
      SWARM_RENDEZVOUS: galaxy-v2
      SWARM_BOOTSTRAP_SEEDS: swarm-node-1@swarm-node-1:7001
      SWARM_FORWARD_MODE: http
      VALIDATOR_HTTP_URL: http://authority-chain:1317/galaxy/v1/events
      SWARM_CREATOR_ADDRESS: galaxy1swarmsubmitter
      SWARM_TLS_CERT: /certs/swarm-node.crt
      SWARM_TLS_KEY: /certs/swarm-node.key
      SWARM_CLIENT_CA: /certs/ca.crt
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    ports:
      - "7002:7001"
      - "8444:8443"
      - "8082:8081"
    depends_on:
      swarm-node-1:
        condition: service_healthy
    volumes:
      - ./infra/certs/dev:/certs:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  edge-planet:
    build: ./edge-planet
    container_name: galaxy-edge-planet
    environment:
      SWARM_INGEST_URL: https://swarm-node-1:8443/ingest
      EDGE_TENANT_API_KEY: ${EDGE_TENANT_API_KEY:?set EDGE_TENANT_API_KEY in .env}
      EDGE_DEVICE_ID: ""
      RTSP_URL: ${RTSP_URL:-}
      REAL_INFERENCE_URL: ${REAL_INFERENCE_URL:-}
      CAMERA_POLL_INTERVAL_SECONDS: ${CAMERA_POLL_INTERVAL_SECONDS:-1.5}
      CAMERA_MIN_CONFIDENCE: ${CAMERA_MIN_CONFIDENCE:-0.75}
      MODEL_PATH: ${MODEL_PATH:-/models/default-model.json}
      EDGE_CA_CERT: /certs/ca.crt
      EDGE_CLIENT_CERT: /certs/edge-planet.crt
      EDGE_CLIENT_KEY: /certs/edge-planet.key
      FL_ENABLED: "true"
      FL_AGGREGATOR_URL: http://fl-aggregator:8200
      FL_CLIENT_ID: edge-planet-1
      FL_MODEL_DIM: 32
      FL_SYNC_INTERVAL_SECONDS: 90
    ports:
      - "8100:8100"
    depends_on:
      swarm-node-1:
        condition: service_healthy
      fl-aggregator:
        condition: service_started
    volumes:
      - ./infra/certs/dev:/certs:ro,z
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  fl-aggregator:
    build: ./intelligence-layer/fl-aggregator
    container_name: galaxy-fl-aggregator
    environment:
      FL_DATABASE_URL: postgresql://${POSTGRES_USER:-galaxy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-galaxy}
      FL_MODEL_DIR: /data/fl-models
      FL_MODEL_SIZE: 32
      FL_MIN_UPDATES_FOR_AGG: 2
      FL_MAX_PENDING_UPDATES: 300
    volumes:
      - fl_models:/data/fl-models
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  predictive-service:
    build: ./intelligence-layer/predictive-service
    container_name: galaxy-predictive-service
    environment:
      PRED_AUTHORITY_URL: http://authority-chain:1317
      PRED_SWARM_PUBLISH_URL: https://swarm-node-1:8443/ingest-prediction
      PRED_SWARM_API_KEY: predictive-service
      PRED_CA_CERT: /certs/ca.crt
      PRED_CLIENT_CERT: /certs/edge-planet.crt
      PRED_CLIENT_KEY: /certs/edge-planet.key
      PRED_LOOP_INTERVAL_SECONDS: 45
      PRED_TRAIN_WINDOW: 200
      PRED_RISK_THRESHOLD: 0.65
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    volumes:
      - ./infra/certs/dev:/certs:ro,z
      - ./shared:/app/shared:ro,z
    ports:
      - "8300:8300"
    depends_on:
      authority-chain:
        condition: service_healthy
      swarm-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  compliance-engine:
    build: ./expansion-layer/compliance-engine
    container_name: galaxy-compliance-engine
    environment:
      COMPLIANCE_DEFAULT_REGION: ${COMPLIANCE_DEFAULT_REGION:-eu}
      COMPLIANCE_HIPAA_EVENT_TYPES: health_alert,patient_fall
      COMPLIANCE_PII_KEYS: name,face_id,person_name
      COMPLIANCE_ENCRYPTION_KEY: ${COMPLIANCE_ENCRYPTION_KEY:?set COMPLIANCE_ENCRYPTION_KEY in .env}
      COMPLIANCE_AUDIT_LOG_PATH: /data/compliance-audit.jsonl
      COMPLIANCE_DATABASE_URL: postgresql://${POSTGRES_USER:-galaxy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-galaxy}
    ports:
      - "8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - compliance_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  webhook-service:
    build: ./expansion-layer/webhook-service
    container_name: galaxy-webhook-service
    environment:
      WEBHOOK_DATABASE_URL: postgresql://${POSTGRES_USER:-galaxy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-galaxy}
      WEBHOOK_AUTHORITY_EVENTS_URL: http://authority-chain:1317/galaxy/v1/events
      WEBHOOK_POLL_INTERVAL_SECONDS: 5
      WEBHOOK_MAX_RETRIES: 4
      WEBHOOK_BACKOFF_BASE_SECONDS: 0.5
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      authority-chain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # LLM Service - uses OpenRouter for chat and event classification
  llm-service:
    build: ./llm-service
    container_name: galaxy-llm-service
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-3.5-turbo}
      OPENROUTER_TIMEOUT: "30"
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-galaxy-mvp}
      LLM_ENABLED: "true"
      LLM_PORT: "8600"
      LLM_HOST: "0.0.0.0"
      LOG_LEVEL: "INFO"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    ports:
      - "8600:8600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./shared:/app/shared:ro,z
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8600/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_AUTH_URL: http://localhost
        REACT_APP_API_URL: http://localhost:1317
        REACT_APP_WS_URL: ws://localhost:1317/websocket
        REACT_APP_PREDICTIVE_URL: http://localhost:8300
        REACT_APP_LLM_URL: http://localhost:8600
    container_name: galaxy-frontend
    ports:
      - "8000:80"
    depends_on:
      authority-chain:
        condition: service_healthy
      predictive-service:
        condition: service_healthy
      llm-service:
        condition: service_started
      auth-service:
        condition: service_healthy

  nginx-gateway:
    image: nginx:alpine
    container_name: galaxy-nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      auth-service:
        condition: service_healthy
      authority-chain:
        condition: service_healthy
      frontend:
        condition: service_started
      edge-planet:
        condition: service_healthy
    networks:
      default:

  landing:
    image: nginx:alpine
    container_name: galaxy-landing
    volumes:
      - ./docs/landing:/usr/share/nginx/html:ro,z
    ports:
      - "8080:80"
    restart: unless-stopped

  hermes-relayer:
    image: informalsystems/hermes:v1.8.2
    container_name: galaxy-hermes-relayer
    profiles: ["ibc"]
    environment:
      RUST_LOG: info
      HERMES_CONFIG: /config/config.toml
    command: ["start", "-c", "/config/config.toml"]
    volumes:
      - ./expansion-layer/hermes/config.toml:/config/config.toml:ro
      - hermes_data:/home/hermes/.hermes
    depends_on:
      authority-chain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "hermes --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  authority_data:
  fl_models:
  compliance_data:
  hermes_data:
