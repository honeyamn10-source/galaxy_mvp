version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: galaxy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: galaxy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for real-time events
  redis:
    image: redis:7-alpine
    container_name: galaxy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authority chain node (galaxyd)
  authority-chain:
    build: ./authority-chain
    container_name: galaxy-authority-chain
    ports:
      - "1317:1317"
      - "9090:9090"
      - "26657:26657"
    environment:
      CHAIN_ID: galaxy-1
      CHAIN_DATA_DIR: /data
      CHAIN_VOTE_THRESHOLD: 2
      CHAIN_GRPC_ADDR: 0.0.0.0:9090
      CHAIN_REST_ADDR: 0.0.0.0:1317
      CHAIN_RPC_ADDR: 0.0.0.0:26657
      CHAIN_REWARD_UGALAXY: 100
      CHAIN_SUBMISSION_FEE_UGALAXY: 5
      CHAIN_ALLOW_FEE_OVERDRAFT: "true"
      CHAIN_VOTE_WINDOW_SECONDS: 3600
      CHAIN_COSMWASM_ENABLED: "true"
      CHAIN_COMPLIANCE_URL: http://compliance-engine:8400
      CHAIN_COMPLIANCE_TIMEOUT: 4s
      LLM_SERVICE_URL: http://llm-service:8600
      LLM_TIMEOUT: "30"
    volumes:
      - authority_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compliance-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1317/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  swarm-node-1:
    build: ./swarm-node
    container_name: galaxy-swarm-node-1
    environment:
      SWARM_NODE_NAME: swarm-node-1
      SWARM_IDENTITY_SEED: swarm-node-1
      SWARM_P2P_PORT: 7001
      SWARM_INGRESS_ADDR: ":8443"
      SWARM_HEALTH_ADDR: ":8081"
      SWARM_RENDEZVOUS: galaxy-v2
      SWARM_BOOTSTRAP_SEEDS: ""
      SWARM_FORWARD_MODE: validator-grpc
      VALIDATOR_GRPC_ADDR: authority-chain:9090
      SWARM_CREATOR_ADDRESS: galaxy1swarmsubmitter
      SWARM_TLS_CERT: /certs/swarm-node.crt
      SWARM_TLS_KEY: /certs/swarm-node.key
      SWARM_CLIENT_CA: /certs/ca.crt
    ports:
      - "7001:7001"
      - "8443:8443"
      - "8081:8081"
    depends_on:
      authority-chain:
        condition: service_started
    volumes:
      - ./infra/certs/dev:/certs:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  swarm-node-2:
    build: ./swarm-node
    container_name: galaxy-swarm-node-2
    environment:
      SWARM_NODE_NAME: swarm-node-2
      SWARM_IDENTITY_SEED: swarm-node-2
      SWARM_P2P_PORT: 7001
      SWARM_INGRESS_ADDR: ":8443"
      SWARM_HEALTH_ADDR: ":8081"
      SWARM_RENDEZVOUS: galaxy-v2
      SWARM_BOOTSTRAP_SEEDS: swarm-node-1@swarm-node-1:7001
      SWARM_FORWARD_MODE: validator-grpc
      VALIDATOR_GRPC_ADDR: authority-chain:9090
      SWARM_CREATOR_ADDRESS: galaxy1swarmsubmitter
      SWARM_TLS_CERT: /certs/swarm-node.crt
      SWARM_TLS_KEY: /certs/swarm-node.key
      SWARM_CLIENT_CA: /certs/ca.crt
    ports:
      - "7002:7001"
      - "8444:8443"
      - "8082:8081"
    depends_on:
      swarm-node-1:
        condition: service_healthy
    volumes:
      - ./infra/certs/dev:/certs:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  edge-planet:
    build: ./edge-planet
    container_name: galaxy-edge-planet
    environment:
      SWARM_INGEST_URL: https://swarm-node-1:8443/ingest
      EDGE_TENANT_API_KEY: ${EDGE_TENANT_API_KEY:-edge-planet-local}
      EDGE_DEVICE_ID: ""
      RTSP_URL: ${RTSP_URL:-}
      MODEL_PATH: ${MODEL_PATH:-/models/default-model.json}
      EDGE_CA_CERT: /certs/ca.crt
      EDGE_CLIENT_CERT: /certs/edge-planet.crt
      EDGE_CLIENT_KEY: /certs/edge-planet.key
      FL_ENABLED: "true"
      FL_AGGREGATOR_URL: http://fl-aggregator:8200
      FL_CLIENT_ID: edge-planet-1
      FL_MODEL_DIM: 32
      FL_SYNC_INTERVAL_SECONDS: 90
    ports:
      - "8100:8100"
    depends_on:
      swarm-node-1:
        condition: service_healthy
      fl-aggregator:
        condition: service_started
    volumes:
      - ./infra/certs/dev:/certs:ro,z
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  fl-aggregator:
    build: ./intelligence-layer/fl-aggregator
    container_name: galaxy-fl-aggregator
    environment:
      FL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/galaxy
      FL_MODEL_DIR: /data/fl-models
      FL_MODEL_SIZE: 32
      FL_MIN_UPDATES_FOR_AGG: 2
      FL_MAX_PENDING_UPDATES: 300
    volumes:
      - fl_models:/data/fl-models
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  predictive-service:
    build: ./intelligence-layer/predictive-service
    container_name: galaxy-predictive-service
    environment:
      PRED_AUTHORITY_URL: http://authority-chain:1317
      PRED_SWARM_PUBLISH_URL: https://swarm-node-1:8443/ingest-prediction
      PRED_SWARM_API_KEY: predictive-service
      PRED_CA_CERT: /certs/ca.crt
      PRED_CLIENT_CERT: /certs/edge-planet.crt
      PRED_CLIENT_KEY: /certs/edge-planet.key
      PRED_LOOP_INTERVAL_SECONDS: 45
      PRED_TRAIN_WINDOW: 200
      PRED_RISK_THRESHOLD: 0.65
    volumes:
      - ./infra/certs/dev:/certs:ro,z
    ports:
      - "8300:8300"
    depends_on:
      authority-chain:
        condition: service_healthy
      swarm-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  compliance-engine:
    build: ./expansion-layer/compliance-engine
    container_name: galaxy-compliance-engine
    environment:
      COMPLIANCE_DEFAULT_REGION: ${COMPLIANCE_DEFAULT_REGION:-eu}
      COMPLIANCE_HIPAA_EVENT_TYPES: health_alert,patient_fall
      COMPLIANCE_PII_KEYS: name,face_id,person_name
      COMPLIANCE_ENCRYPTION_KEY: change-me-in-production
      COMPLIANCE_AUDIT_LOG_PATH: /data/compliance-audit.jsonl
      COMPLIANCE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/galaxy
    ports:
      - "8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - compliance_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  webhook-service:
    build: ./expansion-layer/webhook-service
    container_name: galaxy-webhook-service
    environment:
      WEBHOOK_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/galaxy
      WEBHOOK_AUTHORITY_EVENTS_URL: http://authority-chain:1317/galaxy/v1/events
      WEBHOOK_POLL_INTERVAL_SECONDS: 5
      WEBHOOK_MAX_RETRIES: 4
      WEBHOOK_BACKOFF_BASE_SECONDS: 0.5
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      authority-chain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # LLM Service - wraps Ollama API for event analysis and chat
  # Prerequisites: Ollama running (host or container) with deepseek-llm:6.7b pulled
  # On Docker Desktop: use 'host.docker.internal:11434' for host Ollama
  # On Linux: use '172.17.0.1:11434' for gateway IP, or run Ollama in a container and link it
  llm-service:
    build: ./llm-service
    container_name: galaxy-llm-service
    environment:
      # Point to Ollama running on the host (Docker Desktop)
      # For Linux host, use '172.17.0.1:11434' or run Ollama in a container
      # For Ollama container on same network, use 'ollama:11434'
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: deepseek-llm:6.7b
      OLLAMA_TIMEOUT: "60"
      LLM_ENABLED: "true"
      LLM_PORT: "8600"
      LLM_HOST: "0.0.0.0"
      LOG_LEVEL: "INFO"
    ports:
      - "8600:8600"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8600/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
    # Note: The LLM service doesn't depend on other services; it can start independently
    # Comment out this section if running Ollama on the host via Docker Desktop

  hermes-relayer:
    image: informalsystems/hermes:v1.8.2
    container_name: galaxy-hermes-relayer
    profiles: ["ibc"]
    environment:
      RUST_LOG: info
      HERMES_CONFIG: /config/config.toml
    command: ["start", "-c", "/config/config.toml"]
    volumes:
      - ./expansion-layer/hermes/config.toml:/config/config.toml:ro
      - hermes_data:/home/hermes/.hermes
    depends_on:
      authority-chain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "hermes --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  authority_data:
  fl_models:
  compliance_data:
  hermes_data:
