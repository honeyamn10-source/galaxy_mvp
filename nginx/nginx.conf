worker_processes auto;
events { worker_connections 2048; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=events:10m rate=300r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()";

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            set $auth_upstream http://auth-service:8700;
            proxy_pass $auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /galaxy/ {
            limit_req zone=events burst=80 nodelay;
            limit_req_status 429;
            set $authority_upstream http://authority-chain:1317;
            proxy_pass $authority_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /emit {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            set $edge_upstream http://edge-planet:8100;
            proxy_pass $edge_upstream;
            proxy_set_header Host $host;
        }

        location /llm/ {
            set $llm_upstream http://llm-service:8600;
            proxy_pass $llm_upstream/;
            proxy_set_header Host $host;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
