worker_processes auto;
events { worker_connections 2048; }

http {
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=events:10m rate=300r/m;
    limit_req_status 429;

    upstream auth_svc      { server auth-service:8700; }
    upstream authority_svc { server authority-chain:1317; }
    upstream frontend_svc  { server frontend:80; }
    upstream edge_svc      { server edge-planet:8100; }
    upstream llm_svc       { server llm-service:8600; }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /galaxy/ {
            limit_req zone=events burst=80 nodelay;
            limit_req_status 429;
            proxy_pass http://authority_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /emit {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://edge_svc;
            proxy_set_header Host $host;
        }

        location /llm/ {
            proxy_pass http://llm_svc/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_svc;
            proxy_set_header Host $host;
        }
    }
}
