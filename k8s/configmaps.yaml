---
# ConfigMap for database and cache configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: galaxy-config
  namespace: galaxy
data:
  # Database
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: galaxy
  POSTGRES_USER: postgres
  
  # Redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  
  # Authority Chain
  CHAIN_ID: galaxy-1
  CHAIN_DATA_DIR: /data
  CHAIN_GRPC_ADDR: 0.0.0.0:9090
  CHAIN_REST_ADDR: 0.0.0.0:1317
  CHAIN_RPC_ADDR: 0.0.0.0:26657
  CHAIN_VOTE_THRESHOLD: "2"
  CHAIN_REWARD_UGALAXY: "100"
  CHAIN_SUBMISSION_FEE_UGALAXY: "5"
  CHAIN_ALLOW_FEE_OVERDRAFT: "true"
  CHAIN_VOTE_WINDOW_SECONDS: "3600"
  CHAIN_COSMWASM_ENABLED: "true"
  CHAIN_COMPLIANCE_URL: http://compliance-engine:8400
  CHAIN_COMPLIANCE_TIMEOUT: 4s
  
  # Swarm
  SWARM_RENDEZVOUS: galaxy-v2
  SWARM_FORWARD_MODE: validator-grpc
  VALIDATOR_GRPC_ADDR: authority-chain:9090
  
  # Edge Planet
  SWARM_INGEST_URL: https://swarm-node-1:8443/ingest
  EDGE_CA_CERT: /certs/ca.crt
  EDGE_CLIENT_CERT: /certs/edge-planet.crt
  EDGE_CLIENT_KEY: /certs/edge-planet.key
  
  # Federated Learning
  FL_ENABLED: "true"
  FL_AGGREGATOR_URL: http://fl-aggregator:8200
  FL_MODEL_DIM: "32"
  FL_SYNC_INTERVAL_SECONDS: "90"
  FL_MODEL_SIZE: "32"
  FL_MIN_UPDATES_FOR_AGG: "2"
  FL_MAX_PENDING_UPDATES: "300"
  
  # Predictive Service
  PRED_AUTHORITY_URL: http://authority-chain:1317
  PRED_SWARM_PUBLISH_URL: https://swarm-node-1:8443/ingest-prediction
  PRED_SWARM_API_KEY: predictive-service
  PRED_LOOP_INTERVAL_SECONDS: "45"
  PRED_TRAIN_WINDOW: "200"
  PRED_RISK_THRESHOLD: "0.65"
  
  # Webhook Service
  WEBHOOK_AUTHORITY_EVENTS_URL: http://authority-chain:1317/galaxy/v1/events
  WEBHOOK_POLL_INTERVAL_SECONDS: "5"
  WEBHOOK_MAX_RETRIES: "4"
  WEBHOOK_BACKOFF_BASE_SECONDS: "0.5"
  
  # Compliance Engine
  COMPLIANCE_DEFAULT_REGION: eu
  COMPLIANCE_HIPAA_EVENT_TYPES: health_alert,patient_fall
  COMPLIANCE_PII_KEYS: name,face_id,person_name
  COMPLIANCE_AUDIT_LOG_PATH: /data/compliance-audit.jsonl
  
  # Logging
  LOG_LEVEL: INFO
  
  # Prometheus metrics
  METRICS_PORT: "8888"
  METRICS_ENABLED: "true"
---
# ConfigMap for TLS certificates (non-sensitive)
apiVersion: v1
kind: ConfigMap
metadata:
  name: galaxy-tls-config
  namespace: galaxy
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    # Placeholder: Replace with actual CA certificate content
    # This should be generated by cert-manager or your mTLS setup
    -----END CERTIFICATE-----
