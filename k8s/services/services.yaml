---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: galaxy
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: galaxy
  labels:
    app: redis
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
---
# Authority Chain Services
apiVersion: v1
kind: Service
metadata:
  name: authority-chain
  namespace: galaxy
  labels:
    app: authority-chain
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: authority-chain
  ports:
  - port: 1317
    targetPort: 1317
    name: rest
  - port: 9090
    targetPort: 9090
    name: grpc
  - port: 26657
    targetPort: 26657
    name: rpc
  - port: 26656
    targetPort: 26656
    name: p2p
---
# Authority Chain REST Endpoint (for external access)
apiVersion: v1
kind: Service
metadata:
  name: authority-chain-rest
  namespace: galaxy
  labels:
    app: authority-chain
spec:
  type: LoadBalancer
  selector:
    app: authority-chain
  ports:
  - port: 80
    targetPort: 1317
    name: rest
---
# Swarm Node Services
apiVersion: v1
kind: Service
metadata:
  name: swarm-node
  namespace: galaxy
  labels:
    app: swarm-node
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: swarm-node
  ports:
  - port: 7001
    targetPort: 7001
    name: p2p
  - port: 8443
    targetPort: 8443
    name: ingress
  - port: 8081
    targetPort: 8081
    name: health
---
# Swarm Node Ingress Endpoint
apiVersion: v1
kind: Service
metadata:
  name: swarm-node-ingress
  namespace: galaxy
  labels:
    app: swarm-node
spec:
  type: LoadBalancer
  selector:
    app: swarm-node
  ports:
  - port: 443
    targetPort: 8443
    name: ingress
---
