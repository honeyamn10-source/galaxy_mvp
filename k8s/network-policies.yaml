---
# Network Policies for Galaxy namespace
# Implements zero-trust networking - deny all by default, allow specific flows

# Deny all ingress traffic by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: galaxy
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Deny all egress traffic by default (optional - can be more restrictive)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: galaxy
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
# Allow traffic to PostgreSQL (port 5432) from specific services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: authority-chain
    - podSelector:
        matchLabels:
          app: fl-aggregator
    - podSelector:
        matchLabels:
          app: webhook-service
    - podSelector:
        matchLabels:
          app: compliance-engine
    ports:
    - protocol: TCP
      port: 5432

---
# Allow traffic to Redis (port 6379) from edge planets and authority chain
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: edge-planet
    - podSelector:
        matchLabels:
          app: authority-chain
    ports:
    - protocol: TCP
      port: 6379

---
# Allow swarm nodes to communicate with authority chain (gRPC port 9090)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-swarm-to-authority
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: authority-chain
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: swarm-node
    - podSelector:
        matchLabels:
          app: edge-planet
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 1317
    - protocol: TCP
      port: 26657

---
# Allow swarm nodes to communicate with each other (p2p)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-swarm-p2p
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: swarm-node
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: swarm-node
    - podSelector:
        matchLabels:
          app: edge-planet
    ports:
    - protocol: TCP
      port: 7001
    - protocol: TCP
      port: 8443

---
# Allow edge planets to communicate with swarm and FL aggregator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: edge-planet
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: swarm-node
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - podSelector:
        matchLabels:
          app: fl-aggregator
    ports:
    - protocol: TCP
      port: 8200
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
# Allow webhook service to access authority chain and external networks
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: webhook-service
  policyTypes:
  - Egress
  egress:
  # To authority chain
  - to:
    - podSelector:
        matchLabels:
          app: authority-chain
    ports:
    - protocol: TCP
      port: 1317
  # To external networks (for webhook delivery)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
# Allow compliance engine to access PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-compliance-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: compliance-engine
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
# Allow predictive service to access authority chain
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-predictive-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: predictive-service
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: authority-chain
    ports:
    - protocol: TCP
      port: 1317
  - to:
    - podSelector:
        matchLabels:
          app: swarm-node
    ports:
    - protocol: TCP
      port: 8443
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
# Allow dashboard to access authority chain
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-access
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: authority-chain
    ports:
    - protocol: TCP
      port: 1317
    - protocol: TCP
      port: 26657
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
# Allow Prometheus to scrape metrics from all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: galaxy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: galaxy-monitoring
    ports:
    - protocol: TCP
      port: 8888  # metrics port

---
# Allow external ingress traffic to dashboard and API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traffic
  namespace: galaxy
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
