---
# Dashboard Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: galaxy
  labels:
    app: dashboard
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        tier: frontend
    spec:
      containers:
      - name: dashboard
        image: galaxy-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 8888
          name: metrics
        env:
        - name: REACT_APP_API_URL
          value: "http://authority-chain:1317"
        - name: REACT_APP_WS_URL
          value: "ws://authority-chain:26657/websocket"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: galaxy-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
