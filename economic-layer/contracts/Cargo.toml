[workspace]
members = [
  "planet-registry",
  "event-reward",
  "staking",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Galaxy Team"]
license = "Apache-2.0"

[workspace.dependencies]
cosmwasm-std = "1.5.5"
cw-storage-plus = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
serde-json-wasm = "1.0.1"
