name: Cloudflare Pages CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_note:
        description: Optional release context for audit trail
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  preflight:
    name: Validate Cloudflare Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Fail fast when required secrets are missing
        run: |
          set -euo pipefail
          missing=0
          for key in CF_PAGES_PROJECT_NAME CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: ${key}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  detect:
    name: Detect Project Type
    runs-on: ubuntu-latest
    needs: [ preflight ]
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      app_dir: ${{ steps.detect.outputs.app_dir }}
      build_command: ${{ steps.detect.outputs.build_command }}
      output_dir: ${{ steps.detect.outputs.output_dir }}
      install_command: ${{ steps.detect.outputs.install_command }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-detect framework and build config
        id: detect
        run: |
          chmod +x scripts/cloudflare-pages/detect_project.sh
          DETECT_OUT="$(bash scripts/cloudflare-pages/detect_project.sh .)"
          echo "$DETECT_OUT"
          echo "$DETECT_OUT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [ detect ]
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    concurrency:
      group: cloudflare-pages-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node with npm cache
        uses: actions/setup-node@v4
        if: ${{ needs.detect.outputs.install_command != '' }}
        with:
          node-version: 20
          cache: npm

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Set deployment branch
        id: branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "cf_branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "cf_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and deploy with retry
        id: deploy
        env:
          APP_DIR: ${{ needs.detect.outputs.app_dir }}
          BUILD_COMMAND: ${{ needs.detect.outputs.build_command }}
          OUTPUT_DIR: ${{ needs.detect.outputs.output_dir }}
          INSTALL_COMMAND: ${{ needs.detect.outputs.install_command }}
          CF_BRANCH: ${{ steps.branch.outputs.cf_branch }}
          MAX_ATTEMPTS: 3
        run: |
          chmod +x scripts/cloudflare-pages/deploy_retry.sh
          bash scripts/cloudflare-pages/deploy_retry.sh

      - name: Post deployment summary
        if: always()
        run: |
          echo "## Cloudflare Pages Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release note: ${{ github.event.inputs.release_note || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project type: ${{ needs.detect.outputs.project_type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App directory: ${{ needs.detect.outputs.app_dir }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build command: ${{ needs.detect.outputs.build_command || 'none (static)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output directory: ${{ needs.detect.outputs.output_dir }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: ${{ steps.deploy.outputs.pages_url || 'see wrangler logs' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate deployed site availability
        if: ${{ steps.deploy.outputs.pages_url != '' }}
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.pages_url }}"
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Deployment URL did not become reachable: $url" >&2
          exit 1

      - name: Comment PR preview URL
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.pages_url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `✅ Cloudflare Pages preview is ready:\n\n${{ toJSON(steps.deploy.outputs.pages_url) }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
