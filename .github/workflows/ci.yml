name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python sources
        run: python -m compileall -q auth-service backend edge-planet expansion-layer intelligence-layer llm-service shared
      - name: Run repository tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest bcrypt PyJWT fastapi pydantic[email] sqlalchemy
          pytest -q test_auth.py

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [authority-chain, swarm-node]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          CI: "true"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_USER: galaxy
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: galaxy
          JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
          INTERNAL_API_KEY: test-only-internal-key-with-at-least-32-characters
          EDGE_TENANT_API_KEY: test-only-edge-key-with-at-least-32-characters
          COMPLIANCE_ENCRYPTION_KEY: test-only-compliance-key-with-32-chars
        run: docker compose config --quiet
