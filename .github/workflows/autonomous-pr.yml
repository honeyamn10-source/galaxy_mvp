name: Autonomous PR Creator

on:
  push:
    branches:
      - feature/ai-improvement-*

permissions:
  contents: read
  pull-requests: write

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            const title = `Autonomous Improvement: ${head}`;
            const body = [
              '## Autonomous AI Improvement PR',
              '',
              '- Generated by autonomous engineering workflow',
              '- Includes code, DevOps, and deployment quality gates',
              '- Will auto-merge only after all checks pass',
              '',
              '### Risk analysis',
              '- CI verifies build/deploy safety',
              '- Security checks run before merge',
              '- Auto-merge is blocked on any failed required check'
            ].join('\n');

            let pr;
            if (prs.data.length > 0) {
              pr = prs.data[0];
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title, body });
            } else {
              const created = await github.rest.pulls.create({ owner, repo, head, base, title, body });
              pr = created.data;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: ['autonomous-ai', 'needs-review']
            });

            core.notice(`PR ready: ${pr.html_url}`);
            core.setOutput('pr_url', pr.html_url);
