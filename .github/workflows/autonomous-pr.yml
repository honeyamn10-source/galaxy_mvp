name: Autonomous PR Creator

on:
  push:
    branches:
      - feature/ai-improvement-*

permissions:
  contents: write
  pull-requests: write

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub CLI available
        run: gh --version

      - name: Create or update PR using gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="Autonomous Improvement: ${BRANCH}"
          BODY="## Autonomous AI Improvement PR

- Generated by autonomous engineering workflow
- Includes code, DevOps, and deployment quality gates
- Will auto-merge only after all checks pass

### Risk analysis
- CI verifies build/deploy safety
- Security checks run before merge
- Auto-merge is blocked on any failed required check"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY" --add-label autonomous-ai --add-label needs-review
          else
            gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH"
            gh pr edit "$BRANCH" --add-label autonomous-ai --add-label needs-review
          fi
