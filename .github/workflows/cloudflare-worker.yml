name: Cloudflare Worker Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'workers/**'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKER_HEALTHCHECK_URL: ${{ secrets.WORKER_HEALTHCHECK_URL }}

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-worker-main
      cancel-in-progress: true
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN WORKER_HEALTHCHECK_URL; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy worker with retries
        run: |
          set -euo pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if wrangler deploy --config wrangler.toml; then
              echo "Worker deployment successful on attempt $i"
              exit 0
            fi
            if [ "$i" -eq "$attempts" ]; then
              echo "Worker deployment failed after $attempts attempts" >&2
              exit 1
            fi
            sleep $((i * 5))
          done

      - name: Validate worker /health endpoint
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/worker-health.json -w "%{http_code}" "$WORKER_HEALTHCHECK_URL" || true)
            if [ "$code" = "200" ] && grep -qi '"status"' /tmp/worker-health.json; then
              echo "Worker health check passed"
              exit 0
            fi
            sleep 4
          done
          echo "Worker health check failed for $WORKER_HEALTHCHECK_URL" >&2
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Cloudflare Worker Deployment"
            echo "- Worker path: workers/worker.js"
            echo "- Config: workers/wrangler.toml"
            echo "- Health URL: $WORKER_HEALTHCHECK_URL"
          } >> "$GITHUB_STEP_SUMMARY"
