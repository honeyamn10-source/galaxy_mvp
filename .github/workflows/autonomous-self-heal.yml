name: Autonomous Self Heal

on:
  workflow_run:
    workflows:
      - Cloudflare Pages CI/CD
      - Cloudflare Worker Deploy
      - Autonomous Review And Safe Merge
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  self-heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Analyze failed jobs and rerun once safely
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });

            const failed = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            const failedNames = failed.map(j => j.name);

            core.notice(`Failed workflow: ${run.name} (#${run.run_number}), attempt ${run.run_attempt}`);
            core.notice(`Failed jobs: ${failedNames.join(', ') || 'unknown'}`);

            if (run.run_attempt >= 3) {
              core.setFailed(`Safe stop reached at attempt ${run.run_attempt}. Manual intervention required.`);
              return;
            }

            await github.rest.actions.reRunWorkflowFailedJobs({
              owner,
              repo,
              run_id: run.id,
            });

            core.notice(`Triggered rerun of failed jobs for run ${run.id}`);
