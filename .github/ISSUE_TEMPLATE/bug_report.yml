name: Bug report
description: Report a problem with Galaxy
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run 'make swarm-up'
        2. Configure '...'
        3. Trigger '...'
        4. See error
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Affected phase / service
      description: e.g. Phase II — swarm-node
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Relevant logs with secrets, keys, and IPs removed.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm this report contains no personal data, secrets, or live camera data.
          required: true