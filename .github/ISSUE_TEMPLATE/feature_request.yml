name: Feature request
description: Suggest an idea for Galaxy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it behave? Which phase or service does it affect?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches considered and why they did not work.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Design notes, references, or mockups.