name: galaxy-worker-deploy
description: Triggers Cloudflare Worker deployment workflow.
inputs:
  branch_name:
    type: string
    description: Branch to deploy from.
    default: main
  change_ticket:
    type: string
    description: Optional change ticket or goal identifier.
    default: "paperclip-goal"
runs:
  using: github-api
  method: POST
  endpoint: /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches
  repository: honeyamn10-source/galaxy_mvp
  owner: honeyamn10-source
  repo: galaxy_mvp
  workflow_id: cloudflare-worker.yml
  token_env: GITHUB_TOKEN
  body:
    ref: "${{ inputs.branch_name }}"
    inputs:
      change_ticket: "${{ inputs.change_ticket }}"
