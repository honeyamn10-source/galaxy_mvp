name: galaxy-pages-deploy
description: Triggers Cloudflare Pages deployment workflow.
inputs:
  branch_name:
    type: string
    description: Branch to deploy from.
    default: main
  release_note:
    type: string
    description: Optional release context for deployment auditability.
    default: "Paperclip-requested deployment"
runs:
  using: github-api
  method: POST
  endpoint: /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches
  repository: honeyamn10-source/galaxy_mvp
  owner: honeyamn10-source
  repo: galaxy_mvp
  workflow_id: cloudflare-pages.yml
  token_env: GITHUB_TOKEN
  body:
    ref: "${{ inputs.branch_name }}"
    inputs:
      release_note: "${{ inputs.release_note }}"
