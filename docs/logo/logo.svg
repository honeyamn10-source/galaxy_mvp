    <circle cx="512" cy="512" r="292" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 8"/>
  </g>
  <path d="M512 140 L512 68 M512 884 L512 956" stroke="#38bdf8" stroke-width="3" opacity="0.35"/>
  <path d="M740 512 L812 512 M212 512 L140 512" stroke="#38bdf8" stroke-width="3" opacity="0.35"/>
  <path d="M673 351 L723 301 M351 673 L301 723 M673 673 L723 723 M351 351 L301 301" stroke="#38bdf8" stroke-width="3" opacity="0.35"/>
  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="70" fill="#0b1b33" stroke="url(#ring)" stroke-width="12"/>
    <circle cx="512" cy="512" r="34" fill="url(#nucleus)"/>
    <path d="M512 492 L534 519 L512 545 L490 519 Z" fill="#0a1222"/>
  </g>
  <g>
