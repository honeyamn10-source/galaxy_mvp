      <circle r="4" fill="#a855f7"/>
    </g>
    <g transform="translate(512 726)">
      <circle r="34" fill="#0d1a2e" stroke="#38bdf8" stroke-width="4"/>
      <circle r="4" fill="#38bdf8"/>
    </g>
    <g transform="translate(290 602)">
      <circle r="34" fill="#0d1a2e" stroke="#e879f9" stroke-width="4"/>
      <circle r="4" fill="#e879f9"/>
