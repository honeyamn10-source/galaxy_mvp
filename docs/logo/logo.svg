<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Galaxy — decentralized AI event-detection platform</title>
  <desc id="desc">A ring of six authenticated swarm nodes orbiting an authority-chain nucleus on a deep-space field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="space" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0" stop-color="#0e1b3a"/>
      <stop offset="1" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="nucleus" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="url(#space)"/>
  <g opacity="0.28">
